policies:
  - id: policy.discount
    text: "Скидку до 5% менеджер может дать сам при заказе от 100 000 ₽. Скидку больше 5% согласует только руководитель отдела продаж — клиенту ничего не обещаем до согласования."

  - id: policy.refund_escalation
    text: "Возврат после 14 дней, товара со следами использования или спор о браке — только через руководителя сервисного отдела. Менеджер не обещает возврат и компенсацию сам."

  - id: policy.no_competitor_price_match
    text: "Под цены конкурентов цену не снижаем. Вместо этого можно предложить рассрочку 0% или комплект с аксессуарами."

upsell_rules:
  - id: rule.laptop_warranty
    if_product_tags_any: [laptop]
    offer_id: product.warranty_plus
    why: "Снижает страх поломки дорогой покупки"
    never_if_intents: [complaint, refund]

  - id: rule.laptop_bag
    if_product_tags_any: [laptop]
    offer_id: product.bag
    why: "Защищает ноутбук при переноске; частая покупка в комплекте"
    never_if_intents: [complaint, refund]

  - id: rule.laptop_mouse
    if_product_tags_any: [laptop]
    offer_id: product.mouse_m3
    why: "Удобнее тачпада для работы; недорогое дополнение"
    never_if_intents: [complaint, refund]

  - id: rule.laptop_setup
    if_product_tags_any: [laptop]
    if_intents_any: [order_intent, delivery_payment_question]
    offer_id: product.setup_service
    why: "Клиент близок к покупке — настройка экономит ему время в первый день"
    never_if_intents: [complaint, refund]

  - id: rule.office_for_work
    if_message_keywords_any: ["работа", "учёба", "документы", "word", "excel", "таблицы"]
    offer_id: product.office_suite
    why: "Клиент упомянул работу или учёбу с документами"
    never_if_intents: [complaint, refund]

  - id: rule.dock_for_monitor
    if_message_keywords_any: ["монитор", "два экрана", "внешний экран"]
    offer_id: product.dock_d7
    why: "Клиент хочет подключать монитор — док-станция даёт HDMI и зарядку одним кабелем"
    never_if_intents: [complaint, refund]
