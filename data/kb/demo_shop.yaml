# Демо-БЗ вымышленного интернет-магазина ноутбуков «НоутЛайн» (допущение A1 в SPEC).
# Схема: app/kb/models.py. Проверка: uv run python -m app.kb.validate data/kb
version: 1

company:
  name: "НоутЛайн"
  tone: "на вы, дружелюбно, коротко, без канцелярита и лишних восклицаний"
  signature: "Команда НоутЛайн"
  fallback_reply: "Здравствуйте! Спасибо за сообщение. Уточню детали и вернусь с ответом в ближайшее время."

faq:
  - id: faq.delivery_moscow
    questions:
      - "доставка по Москве"
      - "сколько стоит доставка курьером"
      - "когда привезёте в Москве"
      - "доставка по мск завтра успеете"
      - "когда сможете доставить"
    answer: "По Москве доставляем курьером за 1–2 дня. Стоимость — 490 ₽, при заказе от 30 000 ₽ — бесплатно."

  - id: faq.delivery_regions
    questions:
      - "доставка в регионы"
      - "доставка в другой город"
      - "сколько стоит доставка в Казань или Екатеринбург"
      - "сколько везти по России"
      - "отправляете СДЭКом"
      - "за сколько дней доставите в регион"
    answer: "По России доставляем через СДЭК — до пункта выдачи или курьером, за 2–7 рабочих дней в зависимости от города. Стоимость — 690 ₽, при заказе от 50 000 ₽ — бесплатно."

  - id: faq.pickup
    questions:
      - "самовывоз"
      - "можно забрать самому"
      - "где ваш пункт выдачи"
      - "адрес магазина"
    answer: "Самовывоз бесплатный: пункт выдачи в Москве, ул. Примерная, 1, ежедневно с 10:00 до 21:00. Заказ готов к выдаче через 2 часа после подтверждения."

  - id: faq.payment
    questions:
      - "как оплатить"
      - "можно оплатить при получении"
      - "оплата картой или наличными"
      - "есть оплата по СБП"
      - "способы оплаты"
    answer: "Оплатить можно картой онлайн, по СБП, а также наличными или картой при получении — курьеру или в пункте выдачи."

  - id: faq.installment
    questions:
      - "есть рассрочка"
      - "можно купить в кредит"
      - "рассрочка без переплаты"
      - "оплата частями"
    answer: "Есть рассрочка 0% на 6 месяцев через банк-партнёр для заказов от 20 000 ₽. Оформляется онлайн при оформлении заказа, решение банка — за несколько минут."

  - id: faq.returns
    questions:
      - "как вернуть товар"
      - "хочу вернуть ноутбук"
      - "можно сдать обратно если не подошёл"
      - "возврат денег"
    answer: "Вернуть товар можно в течение 14 дней, если он не был в использовании и сохранены упаковка и чек. Деньги возвращаем в течение 10 дней тем же способом, которым была оплата."

  - id: faq.warranty
    questions:
      - "какая гарантия"
      - "гарантия на ноутбук"
      - "что делать если сломался"
      - "где ремонтировать по гарантии"
    answer: "На ноутбуки действует гарантия производителя 1 год, обслуживание — в авторизованных сервисных центрах. Дополнительно можно оформить расширенную гарантию ещё на 2 года."

  - id: faq.corporate
    questions:
      - "покупка на юрлицо"
      - "нужен счёт для организации"
      - "работаете с НДС"
      - "закрывающие документы"
    answer: "Работаем с юрлицами и ИП: выставим счёт, отгрузим с закрывающими документами, цены указаны с НДС."

  - id: faq.working_hours
    questions:
      - "до скольки работаете"
      - "когда ответит менеджер"
      - "режим работы"
      - "работаете в выходные"
    answer: "Заказы на сайте принимаем круглосуточно. Менеджеры на связи ежедневно с 9:00 до 21:00 по Москве."

