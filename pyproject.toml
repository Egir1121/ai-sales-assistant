[project]
name = "ai-sales-assistant"
version = "0.1.0"
description = "AI-ассистент менеджера продаж для amoCRM: ответ клиенту по БЗ + подсказка по допродаже"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0.3",
    "snowballstemmer>=3.1.1",
    "anthropic>=1.9.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "PT", "ASYNC"]
# RUF001-003 ругаются на кириллицу в строках/комментариях как на «похожие символы» — проект русскоязычный.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app", "evals"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "evals", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["snowballstemmer"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
pythonpath = ["."]

[tool.coverage.run]
source = ["app/core", "app/kb", "app/upsell"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
